  folder_menu:
    type: yasb.custom.CustomWidget
    options:
      label: "<span>\uE8B7</span>"
      label_alt: "<span>\uE8B7</span>"
      class_name: "folder-menu-widget"
      tooltip: true
      tooltip_label: "Папки и файлы (Alt+E)"
      exec_options:
        run_cmd: "cmd /c echo ok"
        run_once: true
        return_format: string
      callbacks:
        on_left: "exec C:\\Users\\Laziko\\.config\\yasb\\folder_menu.exe --toggle"
  smart_launcher:
    type: yasb.custom.CustomWidget
    options:
      label: "<span>\uE71E</span>"
      label_alt: "<span>\uE71E</span>"
      class_name: "smart-launcher-widget"
      tooltip: true
      tooltip_label: "Умный поиск программ РУС/ENG (Alt+Space)"
      exec_options:
        run_cmd: "C:\\Users\\Laziko\\.config\\yasb\\smart_launcher.exe --ensure-bg"
        run_once: true
        return_format: string
      callbacks:
        on_left: "exec C:\\Users\\Laziko\\.config\\yasb\\smart_launcher.exe --toggle"
  visual_effects:
    type: yasb.custom.CustomWidget
    options:
      label: "<span>\ue9d2</span>"
      label_alt: "<span>\ue9d2</span>"
      class_name: "effects-widget"
      tooltip: true
      tooltip_label: "Эффекты и Живые обои (Alt+U / Alt+G): ЛКМ меню • СКМ галерея • ПКМ цикл (Видео → Фото → Обычные)"
      exec_options:
        run_cmd: "cmd /c echo ok"
        run_once: true
        return_format: string
      callbacks:
        on_left: "exec C:\\Users\\Laziko\\.config\\yasb\\effects_menu.exe"
        on_middle: "exec C:\\Users\\Laziko\\.config\\yasb\\wallpaper_gallery.exe --toggle"
        on_right: "exec C:\\Users\\Laziko\\.config\\yasb\\live_wallpaper.exe --cycle-state"
  power_control:
    type: yasb.custom.CustomWidget
    options:
      label: "<span>\uE945</span>"
      label_alt: "<span>\uE945</span>"
      class_name: "power-control-widget"
      tooltip: true
      tooltip_label: "ASUS Тишина и CPU: ЛКМ панель • ПКМ цикл (Библиотека / Silent / Balanced / Turbo)"
      exec_options:
        run_cmd: "C:\\Users\\Laziko\\.config\\yasb\\komorebi_launcher.exe --ensure-whkd"
        run_once: true
        return_format: string
      callbacks:
        on_left: "exec C:\\Users\\Laziko\\.config\\yasb\\power_control.exe --toggle"
        on_right: "exec C:\\Users\\Laziko\\.config\\yasb\\power_control.exe --cycle"
