# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      round_corners: true
      round_corners_type: normal
      border_color: system
    window_flags:
      always_on_top: true
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 36
    padding:
      top: 4
      left: 6
      bottom: 0
      right: 6
    widgets:
      left:
      - home
      - smart_launcher
      # - quick_launch
      - komorebi_workspaces
      - folder_menu
      - komorebi_active_layout
      - taskbar
      - active_window
      center:
      - media
      - clock
      - notifications
      - todo
      right:
      - visual_effects
      # - wallpapers
      - weather
      - systray
      - cpu
      - power_control
      - memory
      - language
      - battery
      - volume
      - control_center
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>\uE8A9</span>"
      menu_list:
      - title: "PowerShell  (Alt+V)"
        command: "C:\\Users\\Laziko\\.config\\yasb\\workspace_app.exe"
        args: ["launch", "WindowsTerminal.exe|wt.exe", "wt.exe", "-w", "new", "-p", "Windows PowerShell"]
        show_window: false
      - title: "VS Code  (Alt+C)"
        command: "C:\\Users\\Laziko\\.config\\yasb\\workspace_app.exe"
        args: ["launch", "Code.exe", "C:\\Users\\Laziko\\AppData\\Local\\Programs\\Microsoft VS Code\\Code.exe", "-n"]
        show_window: false
      - title: "Microsoft Edge  (Alt+B)"
        command: "C:\\Users\\Laziko\\.config\\yasb\\workspace_app.exe"
        args: ["launch", "msedge.exe", "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe", "--new-window"]
        show_window: false
      - title: "Explorer  (Alt+Shift+E)"
        command: "C:\\Users\\Laziko\\.config\\yasb\\workspace_app.exe"
        args: ["launch", "explorer.exe", "explorer.exe"]
        show_window: false
      - title: "Шпаргалка клавиш  (Alt+/)"
        command: "C:\\Users\\Laziko\\.config\\yasb\\hotkey_cheatsheet.exe"
        args: ["--toggle"]
        show_window: false
      - title: "Restart Komorebi + Hotkeys"
        command: "C:\\Users\\Laziko\\.config\\yasb\\reload_komorebi.cmd"
        shell: true
        show_window: false
      - separator: true
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12
      callbacks:
        on_left: toggle_menu
      keybindings:
      - keys: "alt+a"
        action: "toggle_menu"
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: "<span>{icon}</span>{%a, %d %b %H:%M}<span>{alarm}</span>"
      label_alt: "<span>{icon}</span>{%H:%M:%S}<span>{alarm}</span>"
      update_interval: 1000
      tooltip: true
      timezones: []
      icons:
        clock_00: "\uDB85\uDC4A"
        clock_01: "\uDB85\uDC3F"
        clock_02: "\uDB85\uDC40"
        clock_03: "\uDB85\uDC41"
        clock_04: "\uDB85\uDC42"
        clock_05: "\uDB85\uDC43"
        clock_06: "\uDB85\uDC44"
        clock_07: "\uDB85\uDC45"
        clock_08: "\uDB85\uDC46"
        clock_09: "\uDB85\uDC47"
        clock_10: "\uDB85\uDC48"
        clock_11: "\uDB85\uDC49"
        clock_12: "\uDB85\uDC4A"
      alarm_icons:
        enabled: "\uF0F3"
        disabled: "\uF0A2"
        snooze: "\uF1F6"
      calendar:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
        extended: true
        show_years: true
        show_holidays: true
        country_code: UZ
        holiday_color: '#ff6b6b'
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "<span>{icon}</span> {level}"
      tooltip: true
      icons:
        muted: "\uE74F"
        '10': "\uE992"
        '30': "\uE993"
        '60': "\uE994"
        '100': "\uE995"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\uF2A5</span>"
      label_alt: '{count} notifications'
      hide_empty: false
      tooltip: true
      callbacks:
        on_left: toggle_menu
        on_middle: clear_notifications
        on_right: toggle_notification
  komorebi_workspaces:
    type: komorebi.workspaces.WorkspaceWidget
    options:
      label_offline: "Komorebi Offline"
      label_workspace_btn: " "
      label_workspace_active_btn: " "
      label_workspace_populated_btn: " "
      label_default_name: '{index}'
      label_zero_index: false
      hide_empty_workspaces: false
      hide_if_offline: false
      enable_scroll_switching: true
  komorebi_active_layout:
    type: komorebi.active_layout.ActiveLayoutWidget
    options:
      hide_if_offline: true
      label: "{icon}"
      layouts:
      - bsp
      - columns
      - rows
      - grid
      - vertical_stack
      - horizontal_stack
      - monocle
      - floating
      - paused
      layout_icons:
        bsp: "BSP"
        columns: "COLS"
        rows: "ROWS"
        grid: "GRID"
        vertical_stack: "V-STK"
        horizontal_stack: "H-STK"
        monocle: "MON"
        floating: "FLT"
        paused: "PAUSE"
      layout_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: left
        direction: down
        offset_top: 6
        offset_left: 0
        show_layout_icons: true
      callbacks:
        on_left: toggle_layout_menu
        on_middle: toggle_monocle
        on_right: next_layout
  battery:
    type: yasb.battery.BatteryWidget
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}% ({time_remaining})"
      update_interval: 5000
      time_remaining_natural: true
      hide_unsupported: true
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: false
      status_thresholds:
        critical: 15
        low: 30
        medium: 75
        high: 95
        full: 100
      status_icons:
        icon_charging: "\uf0e7"
        icon_critical: "\uf244"
        icon_low: "\uf243"
        icon_medium: "\uf242"
        icon_high: "\uf241"
        icon_full: "\uf240"
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: do_nothing
  cpu:
    type: yasb.cpu.CpuWidget
    options:
      label: "<span>\uEEA1</span> {info[percent][total]}%"
      label_alt: '{info[freq][current]} MHz'
      update_interval: 2000
      hide_decimal: true
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  memory:
    type: yasb.memory.MemoryWidget
    options:
      label: "<span>\uE9D9</span> {virtual_mem_free}"
      label_alt: "<span>\uEFC5</span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
      update_interval: 5000
      hide_decimal: true
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
        alignment: center
  quick_launch:
    type: yasb.quick_launch.QuickLaunchWidget
    options:
      label: "<span>\uE71E</span>"
      search_placeholder: Search apps, files, calc, web...
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      home_page: true
      providers:
        apps:
          enabled: true
          prefix: '*'
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
        calculator:
          enabled: true
          prefix: '='
        unit_converter:
          enabled: true
        currency:
          enabled: true
        web_search:
          enabled: true
          prefix: '?'
          engine: google
        system_commands:
          enabled: true
          prefix: '>'
        settings:
          enabled: true
        kill_process:
          enabled: true
        clipboard_history:
          enabled: true
          prefix: 'cb'
        window_switcher:
          enabled: true
          prefix: 'win'
        windows_terminal:
          enabled: true
          prefix: 'wt'
        vscode:
          enabled: true
          prefix: 'vsc'
        file_search:
          enabled: true
          prefix: '/'
        color:
          enabled: true
        snippets:
          enabled: true
      popup:
        width: 720
        height: 480
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        dark_mode: true
      callbacks:
        on_left: toggle_quick_launch
      keybindings:
      - keys: alt+space
        action: toggle_quick_launch
        screen: primary
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[class_name=''{win[class_name]}'' exe=''{win[process][name]}'' hwnd={win[hwnd]}]'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false
  media:
    type: yasb.media.MediaWidget
    options:
      label: '{title}{s}{artist}'
      label_alt: '{title}'
      separator: ' - '
      hide_empty: true
      callbacks:
        on_left: toggle_media_menu
        on_middle: do_nothing 
        on_right: toggle_play_pause
      max_field_size:
        label: 20
        label_alt: 20
      show_thumbnail: true
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 100
      thumbnail_padding: 10
      thumbnail_edge_fade: true
      icons:
        prev_track: "\uE892"
        next_track: "\uE893"
        play: "\uE768"
        pause: "\uE769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        show_volume_slider: true
      scrolling_label:
        enabled: true
        style: bounce
        update_interval_ms: 40
  taskbar:
    type: yasb.taskbar.TaskbarWidget
    options:
      icon_size: 16
      tooltip: true
      show_only_visible: true
      strict_filtering: true
      monitor_exclusive: false
      hide_empty: false
      animation:
        enabled: true
        duration: 200
      preview:
        enabled: true
        width: 240
        delay: 400
        padding: 8
        margin: 8
        blur: true
        peek: true
      grouping:
        enabled: true
        show_count: true
      title_label:
        enabled: false
        show: focused
        min_length: 10
        max_length: 30
      ignore_apps:
        processes: []
        titles: []
        classes: []
      callbacks:
        on_left: toggle_window
        on_middle: close_app
        on_right: context_menu
  window_switcher:
    type: "yasb.window_switcher.WindowSwitcherWidget"
    options:
      label: "<span>\uf2d2</span>"
      icon_size: 64
      max_visible_apps: 6
      show_title: true
      preview:
        enabled: false
        width: 240
      keybindings:
        - keys: "alt+w"
          action: "toggle_window_switcher"
          screen: "cursor"
  weather:
    type: yasb.weather.WeatherWidget
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: {conditions}, {temp} (Min {min_temp} / Max {max_temp})"
      api_key: env
      location: Fergana
      units: metric
      hide_decimal: true
      show_alerts: true
      tooltip: true
      update_interval: 600
      icons:
        sunnyDay: "\ue30d"
        clearNight: "\ue32b"
        cloudyDay: "\ue312"
        cloudyNight: "\ue311"
        rainyDay: "\ue308"
        rainyNight: "\ue333"
        snowyDay: "\ue30a"
        snowyNight: "\ue335"
        blizzardDay: "\udb83\udf36"
        blizzardNight: "\udb83\udf36"
        foggyDay: "\ue303"
        foggyNight: "\ue346"
        thunderstormDay: "\ue30f"
        thunderstormNight: "\ue338"
        default: "\uebaa"
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
        icon_size: 64
        show_hourly_forecast: true
        time_format: 24h
        hourly_point_spacing: 76
        hourly_icon_size: 32
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: '#89b4fa'
        current_line_width: 1
        current_line_style: dot
        hourly_gradient:
          enabled: true
          top_color: '#89b4fa'
          bottom_color: '#1e1e2e'
        hourly_forecast_buttons:
          enabled: true
          default_view: temperature
          temperature_icon: "\udb81\udd99"
          rain_icon: "\udb81\udd96"
          snow_icon: "\udb81\udd98"
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: none
          rain_effect_intensity: 0.5
          snow_effect_intensity: 1.0
          scale_with_chance: true
          enable_debug: false
      callbacks:
        on_left: toggle_card
        on_middle: do_nothing
        on_right: toggle_label
  apps:
    type: yasb.applications.ApplicationsWidget
    options:
      label: "{data}"
      class_name: "apps-widget"
      image_icon_size: 14
      tooltip: true
      app_list:
        - { icon: "\uE756", launch: "wt.exe" }
        - { icon: "\uE774", launch: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe" }
        - { icon: "\uE943", launch: "C:\\Users\\Laziko\\AppData\\Local\\Programs\\Microsoft VS Code\\Code.exe" }
  systray:
    type: yasb.systray.SystrayWidget
    options:
      class_name: "systray"
      label_collapsed: "\uE70D"
      label_expanded: "\uE70E"
      label_position: "left"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: true
      show_unpinned_button: true
      show_in_popup: true
      icons_per_row: 5
      show_battery: false
      show_volume: false
      show_network: false
      tooltip: true
      use_hook: true
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
  language:
    type: yasb.language.LanguageWidget
    options:
      label: "<span>\uF2B7</span> {lang[language_code]}"
      label_alt: "<span>\uF2B7</span> {lang[full_name]}"
      update_interval: 2
      class_name: "language-widget"
      language_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        layout_icon: "\uE765"
        show_layout_icon: true
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  control_center:
    type: yasb.control_center.ControlCenterWidget
    options:
      label: "<span>\uE9E9</span>"
      label_alt: "<span>\uE9E9</span>"
      tooltip: true
      sections_order:
      - system_controls
      - quick_actions
      - sliders
      - power
      - media
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
      callbacks:
        on_left: toggle_menu
  todo:
    type: yasb.todo.TodoWidget
    options:
      label: "<span>\uE9D5</span> {count}/{completed}"
      label_alt: "<span>\uE9D5</span> Tasks: {count}"
      menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: toggle_label
  # wallpapers:
  #   type: yasb.wallpapers.WallpapersWidget
  #   options:
  #     label: "<span>\uE91B</span>"
  #     tooltip: true
  #     image_path: "C:\\Users\\Laziko\\Pictures\\1. Nature Wallpapers"
